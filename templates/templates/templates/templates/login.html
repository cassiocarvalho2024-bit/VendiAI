{% extends "base.html" %}

{% block title %}Login - VendiAI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h2>🔐 Login VendiAI</h2>
        <p>Acesse sua conta e comece a vender mais!</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Nome de Usuário</label>
                <input type="text" id="username" name="username" placeholder="seu_usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <div id="message" class="message"></div>

        <p class="auth-link">
            Não tem conta? <a href="{{ url_for('register') }}">Registre-se aqui</a>
        </p>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');

    try {
        const response = await fetch('{{ url_for("login") }}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
            messageDiv.className = 'message success';
            messageDiv.textContent = 'Login realizado! Redirecionando...';
            setTimeout(() => {
                window.location.href = '{{ url_for("dashboard") }}';
            }, 2000);
        } else {
            messageDiv.className = 'message error';
            messageDiv.textContent = data.error || 'Erro ao fazer login';
        }
    } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = 'Erro na conexão: ' + error.message;
    }
});
</script>
{% endblock %}
